<html>
    <head>
        <title>The Amazing Pokedex</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>The Amazing Pokedex </h1>
        <p>This is a pokedex that will show you the information of a pokemon when you click the button.</p>
        
        <input id="searchInput" type="text" placeholder="e.g. pikachu">
        <button id="showPokemonButton">Try Your Luck</button>
        <p id="pokemonName">Pokemon Name</p>
        <p id="pokemonType">Pokemon Type</p>
        <img id="pokemonImage" src="">
        <script src="script.js"></script>
    </body>    
</html>
